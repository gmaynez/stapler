[project]
name = "stapler"
version = "2.0.0"
description = "Modern Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Stapler Contributors"}
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
stapler = "stapler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/stapler"]

[tool.hatchling.build.targets.wheel.force-include]
"src/stapler/data" = "stapler/data"

[tool.uv]
dev-dependencies = []

[project.urls]
"Homepage" = "https://github.com/gmaynez/stapler"
"Bug Tracker" = "https://github.com/gmaynez/stapler/issues"
"Original Project" = "https://github.com/ahujasid/blender-mcp"
